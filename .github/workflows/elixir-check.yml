name: Check // Elixir Alert Hub

on:
  workflow_dispatch:

jobs:
  test-elixir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Compile
        run: elixirc integrations/elixir/alert_hub.ex
