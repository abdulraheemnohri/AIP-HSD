name: Release // Specialized Polyglot Components

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-zig-cpp:
    name: Build Native Components (Zig/C++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.11.0
      - name: Build Zig
        run: zig build-exe agents/zig/parser.zig
      - name: Build C++ Sniffer
        run: g++ agents/cpp/sniffer.cpp -o sniffer
      - name: Build eBPF Agent
        run: sudo apt-get update && sudo apt-get install -y clang llvm libelf-dev libbpf-dev && clang -O2 -target bpf -c agents/ebpf/observability.c -o observability.o
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: aiphsd-native-binaries
          path: |
            parser
            sniffer
            observability.o

  test-scientific:
    name: Test Scientific Stack (Julia/R/Fortran/F#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
      - uses: r-lib/actions/setup-r@v2
      - uses: ionide/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'
      - name: Run Julia
        run: julia ai_module/forecaster.jl
      - name: Run R
        run: Rscript ai_module/statistics.R
      - name: Build Fortran
        run: gfortran ai_module/risk_sim.f90 -o risk_sim && ./risk_sim
      - name: Build F#
        run: dotnet build ai_module/RiskValidator.fs

  test-logic-legacy:
    name: Test Logic & Legacy (Elixir/Clojure/COBOL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@12.1
      - name: Set up COBOL
        run: sudo apt-get update && sudo apt-get install -y open-cobol
      - name: Run Elixir
        run: elixirc integrations/elixir/alert_hub.ex
      - name: Run Clojure
        run: clj -M ai_module/rules.clj
      - name: Build COBOL
        run: cobc -x integrations/cobol/security_monitor.cbl -o security_monitor && ./security_monitor
