name: Release // Specialized Polyglot Components

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-zig:
    name: Build Zig Packet Parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.11.0
      - name: Build
        run: zig build-exe agents/zig/parser.zig
      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: aiphsd-zig-parser
          path: parser

  build-wasm:
    name: Build Wasm Edge Monitor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install AssemblyScript
        run: npm install -g assemblyscript
      - name: Build Wasm
        run: asc agents/wasm/monitor.ts --target release

  test-julia-r-fortran:
    name: Test Julia/R/Fortran Scientific Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v1
      - uses: r-lib/actions/setup-r@v2
      - name: Set up Fortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Run Julia Forecaster
        run: julia ai_module/forecaster.jl
      - name: Run R Statistics
        run: Rscript ai_module/statistics.R
      - name: Build and Run Fortran Simulator
        run: gfortran ai_module/risk_sim.f90 -o risk_sim && ./risk_sim

  test-elixir-clojure:
    name: Test Elixir/Clojure Logic Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'
      - name: Set up Clojure
        uses: DeLaGuardo/setup-clojure@12.1
        with:
          cli: 1.11.1.1208
      - name: Compile Elixir
        run: elixirc integrations/elixir/alert_hub.ex
      - name: Run Clojure Rules
        run: clj -M ai_module/rules.clj

  test-perl-ruby-lua:
    name: Test Perl/Ruby/Lua Utility Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Perl Forensics
        run: perl scripts/forensics.pl
      - name: Run Ruby Maintenance
        run: ruby scripts/maintenance.rb
      - name: Run Lua Filter
        run: sudo apt-get install -y lua5.3 && lua5.3 plugins/filter.lua
