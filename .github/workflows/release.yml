name: AIP-HSD Enterprise Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build Multi-Platform Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pyinstaller
      - name: Build Binary
        run: pyinstaller --onefile --name hsod-${{ matrix.os }} backend/main.py
      - name: Upload Binary
        uses: actions/upload-artifact@v3
        with:
          name: hsod-${{ matrix.os }}
          path: dist/hsod-${{ matrix.os }}*

  build-docker-ghcr:
    name: Build Multi-Arch Docker Images (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  release:
    name: Create GitHub Release
    needs: [build-binaries, build-docker-ghcr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download Artifacts
        uses: actions/download-artifact@v3
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            hsod-ubuntu-latest/hsod-ubuntu-latest
            hsod-windows-latest/hsod-windows-latest.exe
            hsod-macos-latest/hsod-macos-latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
