<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIP-HSD // STATIC HUD</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="cyber-theme">
    <header>
        <h1 id="logo">AIP-HSD // UNIVERSAL SENTINEL</h1>
    </header>
    <main class="dashboard-grid">
        <section id="global-status" class="card critical">
            <label>GLOBAL THREAT LEVEL</label>
            <div class="value">CRITICAL</div>
        </section>
        <section id="alerts" class="card">
            <label>LIVE ALERTS</label>
            <ul id="alert-list">
                <li>[HIGH] Potential SQLi Detected</li>
            </ul>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
